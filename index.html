<style>
:root {
  --bg: #F5F3EF;
  --surface: #FFFFFF;
  --surface2: #F9F8F6;
  --border: #E6E2DB;
  --hover: #EEEBE5;
  --text: #18160F;
  --muted: #857F75;
  --orange: #C8721A;
  --orange-light: #F5E8D6;
  --green: #16A34A;
  --red: #DC2626;
  --blue: #2563EB;
  --purple: #7C3AED;
  --sans: 'Plus Jakarta Sans', sans-serif;
  --radius: 10px;
  --radius-sm: 6px;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: var(--sans); background: var(--bg); color: var(--text); font-size: 14px; min-height: 100vh; -webkit-font-smoothing: antialiased; }

/* ── Login ── */
#login-screen {
  display: flex; align-items: center; justify-content: center;
  height: 100vh; background: var(--bg);
}
.login-card {
  background: var(--surface); border-radius: 16px; padding: 40px 36px;
  width: 340px; text-align: center;
  box-shadow: 0 2px 12px rgba(0,0,0,0.07), 0 0 0 1px var(--border);
}
.login-logo { margin-bottom: 4px; }
.login-logo img { height: 100px; width: auto; }
.login-sub { font-size: 12px; color: var(--muted); margin-bottom: 28px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.8px; }

/* ── App shell ── */
#app { display: none; flex-direction: column; min-height: 100vh; }

.topbar {
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  padding: 0 20px;
  display: flex; align-items: center;
  height: 50px; gap: 0; position: sticky; top: 0; z-index: 100;
}
.topbar-brand { margin-right: 28px; display: flex; align-items: center; }
.topbar-brand img { height: 40px; width: auto; }
.tab-btn {
  padding: 0 14px; height: 50px; border: none; background: none; cursor: pointer;
  font-size: 13px; font-weight: 600; color: var(--muted);
  border-bottom: 2px solid transparent; font-family: var(--sans);
  transition: color 0.12s; white-space: nowrap;
}
.tab-btn.active { color: var(--orange); border-bottom-color: var(--orange); }
.tab-btn:hover:not(.active) { color: var(--text); }
.topbar-right { margin-left: auto; display: flex; align-items: center; gap: 8px; }
.back-link {
  font-size: 12px; font-weight: 600; color: var(--muted); text-decoration: none;
  padding: 5px 10px; border: 1px solid var(--border); border-radius: var(--radius-sm);
  transition: all 0.12s; font-family: var(--sans);
}
.back-link:hover { color: var(--text); border-color: var(--text); }

.main { padding: 20px; max-width: 1200px; margin: 0 auto; width: 100%; }

/* ── Stat cards ── */
.stat-row { display: grid; grid-template-columns: repeat(4,1fr); gap: 10px; margin-bottom: 16px; }
.stat-card {
  background: var(--surface); border-radius: var(--radius);
  border: 1px solid var(--border); padding: 16px 18px;
}
.stat-num { font-size: 26px; font-weight: 800; letter-spacing: -1px; line-height: 1; }
.stat-lbl { font-size: 10px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.9px; margin-top: 5px; font-weight: 700; }

/* ── Cards ── */
.card { background: var(--surface); border-radius: var(--radius); border: 1px solid var(--border); padding: 18px; }
.card-title { font-size: 10px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.9px; font-weight: 700; margin-bottom: 14px; }

/* ── Grid layouts ── */
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 12px; }
.grid3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; margin-bottom: 16px; }

/* ── Tables ── */
.tbl-wrap { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; }
th {
  text-align: left; padding: 8px 12px;
  border-bottom: 1.5px solid var(--border);
  color: var(--muted); font-size: 10px; text-transform: uppercase;
  letter-spacing: 0.9px; font-weight: 700; white-space: nowrap;
  background: var(--surface2);
}
td { padding: 9px 12px; border-bottom: 1px solid var(--border); vertical-align: middle; font-size: 13px; }
tr:last-child td { border-bottom: none; }
tbody tr:hover td { background: var(--surface2); }

/* ── Form elements ── */
.inp {
  border: 1px solid var(--border); border-radius: var(--radius-sm);
  padding: 8px 11px; font-family: var(--sans); font-size: 13px;
  background: var(--surface); color: var(--text); outline: none;
  transition: border-color 0.12s;
}
.inp:focus { border-color: var(--orange); }
.lbl { display: block; font-size: 10px; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: 0.7px; margin-bottom: 5px; }

/* ── Buttons ── */
.btn {
  border: none; border-radius: var(--radius-sm); padding: 8px 14px;
  font-family: var(--sans); font-size: 13px; font-weight: 600; cursor: pointer;
  transition: all 0.12s; line-height: 1;
}
.btn-primary { background: var(--orange); color: #fff; }
.btn-primary:hover { background: #B5641A; }
.btn-ghost { background: transparent; border: 1px solid var(--border); color: var(--text); }
.btn-ghost:hover { background: var(--hover); }
.btn-danger { background: #fee2e2; color: var(--red); border: 1px solid #fecaca; }
.btn-sm { padding: 5px 10px; font-size: 12px; }

/* ── Period nav ── */
.period-nav { display: flex; align-items: center; gap: 8px; margin-bottom: 16px; flex-wrap: wrap; }
.period-label { font-weight: 700; font-size: 15px; min-width: 160px; text-align: center; }

/* ── Badge ── */
.badge { display: inline-block; padding: 2px 7px; border-radius: 4px; font-size: 11px; font-weight: 700; letter-spacing: 0.2px; }

/* ── Chart containers ── */
.chart-wrap { position: relative; height: 240px; }

/* ── Modal ── */
.modal-overlay {
  position: fixed; inset: 0; background: rgba(0,0,0,0.35);
  display: flex; align-items: center; justify-content: center;
  z-index: 1000; padding: 20px;
}
.modal-box {
  background: var(--surface); border-radius: 14px; padding: 24px;
  width: 100%; max-width: 480px; max-height: 90vh; overflow-y: auto;
  box-shadow: 0 8px 40px rgba(0,0,0,0.15);
}

/* ── Empty states ── */
.empty { text-align: center; padding: 28px; color: var(--muted); font-size: 13px; }

/* ── Revenue split tiles ── */
.rev-tile {
  padding: 14px 16px; background: var(--surface2);
  border: 1px solid var(--border); border-radius: var(--radius-sm);
}
.rev-tile-title { font-size: 11px; color: var(--muted); font-weight: 600; margin-bottom: 8px; }
.rev-tile-row { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; }
.rev-tile-row span { font-size: 12px; color: var(--muted); }
.rev-tile-row b { font-size: 13px; font-weight: 700; color: var(--text); }
.rev-tile-total { font-size: 15px; font-weight: 800; color: var(--orange); margin-top: 8px; padding-top: 8px; border-top: 1px solid var(--border); }

/* ── Responsive ── */
@media (max-width: 640px) {
  .stat-row { grid-template-columns: 1fr 1fr; }
  .grid2, .grid3 { grid-template-columns: 1fr; }
  .main { padding: 12px; }
  .topbar { padding: 0 12px; }
  .tab-btn { padding: 0 10px; font-size: 12px; }
}
</style>

// Strip batch number suffix, but preserve codes like '#10' that start with non-alpha
function baseCode(code) {
  if (!code) return code;
  // codes like '#10' — starts with non-letter, keep as-is
  if (!/^[A-Za-z]/.test(code)) return code;
  return code.replace(/\d+$/, '');
}

// ── Supabase helpers ──────────────────────────────────────────────────────────
async function sbGet(table) {
  try {
    const res = await fetch(SB_URL + '/rest/v1/' + table + '?select=id,data', { headers: SB_HDR });
    if (!res.ok) return [];
    const rows = await res.json();
    return rows.map(r => {
      if (!r.data) return null;
      // data.id is the real business id (bar number, order number etc)
      // r.id is the Supabase row key — keep data.id as authoritative
      const obj = Object.assign({}, r.data);
      if (obj.id == null) obj._rowId = r.id; // only use row id if data has no id
      return obj;
    }).filter(Boolean);
  } catch (_) { return []; }
}

async function sbUpsert(table, id, data) {
  try {
    await fetch(SB_URL + '/rest/v1/' + table, {
      method: 'POST',
      headers: Object.assign({}, SB_HDR, { 'Prefer': 'resolution=merge-duplicates,return=representation' }),
      body: JSON.stringify({ id: id, data: data })
    });
  } catch (_) {}
}

// ── Data loading ──────────────────────────────────────────────────────────────
async function loadData() {
  document.getElementById('content').innerHTML = '<div class="empty">Loading…</div>';
  try {
    try { const o = localStorage.getItem('2down_orders_v4'); if (o) orders = JSON.parse(o); } catch(_) {}
    try { const b = localStorage.getItem('2down_bars_v4');   if (b) bars = JSON.parse(b); }   catch(_) {}
    try { const i = localStorage.getItem('2down_inv_data');  if (i) invData = JSON.parse(i); } catch(_) {}
    try { const r = localStorage.getItem('2down_ratecard');    if (r) rateCard = JSON.parse(r); } catch(_) {}
    try { const g = localStorage.getItem('2down_growler_sales'); if (g) growlerSales = JSON.parse(g); } catch(_) {}

    const [remOrders, remBars, remKegs] = await Promise.all([
      sbGet('orders'), sbGet('bars'), sbGet('kegs')
    ]);

    if (remOrders.length) {
      orders = remOrders.filter(o => o && o.id && o.barId && o.deliveryDate && Array.isArray(o.items));
      localStorage.setItem('2down_orders_v4', JSON.stringify(orders));
    }
    if (remBars.length) {
      bars = remBars;
      localStorage.setItem('2down_bars_v4', JSON.stringify(bars));
    }
    const invRow = remKegs.find(k => k && k.invData);
    if (invRow) { invData = invRow.invData; localStorage.setItem('2down_inv_data', JSON.stringify(invData)); }
    const rcRow = remKegs.find(k => k && k.rateCard);
    if (rcRow) { rateCard = rcRow.rateCard; localStorage.setItem('2down_ratecard', JSON.stringify(rateCard)); }
    const growRow = remKegs.find(k => k && k.growlerSales);
    if (growRow) { growlerSales = growRow.growlerSales; localStorage.setItem('2down_growler_sales', JSON.stringify(growlerSales)); }

    render();
  } catch (e) {
    document.getElementById('content').innerHTML = '<div class="empty">Error: ' + e.message + '</div>';
  }
}

async function saveGrowlers() {
  localStorage.setItem('2down_growler_sales', JSON.stringify(growlerSales));

function uid() { return Math.random().toString(36).slice(2, 14); }

function fmtDate(d) {
  if (!d) return '—';
  const dt = new Date(d + (d.length === 10 ? 'T00:00:00' : ''));
  return dt.toLocaleDateString('en-IN', { day: '2-digit', month: 'short', year: 'numeric' });
}

function fmtINR(n) {
  return '₹' + Math.round(n).toLocaleString('en-IN');
}

function monthLabel(off) {
  const d = new Date();
  d.setDate(1);
  d.setMonth(d.getMonth() + off);
  return d.toLocaleString('en-IN', { month: 'long', year: 'numeric' });
}

function monthRange(off) {
  const n = new Date();
  return {
    start: new Date(n.getFullYear(), n.getMonth() + off, 1),
    end:   new Date(n.getFullYear(), n.getMonth() + off + 1, 1)
  };
}

function getRevenue(o) {
  const hist = HIST_INV[o.id];
  const live = invData[o.id] || {};
  if (hist) {
    return {
      mrp: (hist.mrpAmount || 0) - (Number(live.mrpDiscount) || 0),
      svc: (hist.svcAmount || 0) - (Number(live.svcDiscount) || 0)
    };
  }
  // Live order: compute using rate card (same formula as ops app)
  const rc = rateCard[String(o.barId)] || {};
  const litres = (o.items || []).reduce((s, i) => s + i.qty * i.size, 0);
  const mrpGross = Math.ceil(MRP_PER_LITRE * 1.02 * litres);
  const mrpFinal = mrpGross - (Number(live.mrpDiscount) || 0);
  let svcGross = 0;
  (o.items || []).forEach(item => {
    const r = rc[item.beer] || {};
    if (r.rate) svcGross += (Number(r.rate) - MRP_PER_LITRE) * item.qty * item.size;
  });
  const svcFinal = parseFloat((svcGross - (Number(live.svcDiscount) || 0)).toFixed(2));
  return { mrp: mrpFinal, svc: svcFinal };
}

function findBar(barId) {
  // coerce both sides — data.id may be number, barId from orders may be number or string
  return bars.find(x => Number(x.id) === Number(barId));
}

function allOrders() {
  return [...orders, ...HISTORICAL_ORDERS].filter(o => {
    const b = findBar(o.barId) || { barName: '' };
    return !b.barName.toLowerCase().includes('patel provision');
  });
}

function ordersInRange(off) {
  const { start, end } = monthRange(off);
  return allOrders().filter(o => { const d = new Date(o.deliveryDate); return d >= start && d < end; });
}

// ── Charts ────────────────────────────────────────────────────────────────────
const _charts = {};
function destroyChart(id) { if (_charts[id]) { _charts[id].destroy(); delete _charts[id]; } }

function makeBarChart(id, labels, datasets, yTickFmt) {
  destroyChart(id);
  const ctx = document.getElementById(id);
  if (!ctx) return;
  _charts[id] = new Chart(ctx, {
    type: 'bar',
    data: { labels: labels, datasets: datasets },
    options: {
      responsive: true, maintainAspectRatio: false,
      plugins: { legend: { display: datasets.length > 1, labels: { font: { family: 'Plus Jakarta Sans', size: 11 }, boxWidth: 12 } } },
      scales: {
        x: { grid: { display: false }, ticks: { font: { family: 'Plus Jakarta Sans', size: 11 } } },
        y: {
          grid: { color: '#E6E2DB' },
          ticks: {
            font: { family: 'Plus Jakarta Sans', size: 11 },
            callback: yTickFmt || (v => '₹' + Math.round(v / 1000) + 'k')
          }
        }
      }
    }
  });
}

function makeStackedBarChart(id, labels, datasets) {
  destroyChart(id);
  const ctx = document.getElementById(id);
  if (!ctx) return;
  _charts[id] = new Chart(ctx, {
    type: 'bar',
    data: { labels: labels, datasets: datasets },
    options: {
      responsive: true, maintainAspectRatio: false,
      plugins: {
        legend: { labels: { font: { family: 'Plus Jakarta Sans', size: 11 }, boxWidth: 12 } },
        tooltip: {
          callbacks: {
            label: function(ctx) {
              return ' ' + ctx.dataset.label + ': ₹' + Math.round(ctx.parsed.y).toLocaleString('en-IN');
            }
          }
        }
      },
      scales: {
        x: { stacked: true, grid: { display: false }, ticks: { font: { family: 'Plus Jakarta Sans', size: 11 } } },
        y: { stacked: true, grid: { color: '#E6E2DB' }, ticks: { font: { family: 'Plus Jakarta Sans', size: 11 }, callback: v => '₹' + Math.round(v/1000) + 'k' } }
      }
    }
  });
}

function makeDoughnut(id, labels, data, colors, tooltipFmt) {
  destroyChart(id);
  const ctx = document.getElementById(id);
  if (!ctx) return;
  const total = data.reduce((s, v) => s + v, 0);
  _charts[id] = new Chart(ctx, {
    type: 'doughnut',
    data: { labels: labels, datasets: [{ data: data, backgroundColor: colors, borderWidth: 2, borderColor: '#fff' }] },
    options: {
      responsive: true, maintainAspectRatio: false, cutout: '65%',
      plugins: {
        legend: { position: 'right', labels: { font: { family: 'Plus Jakarta Sans', size: 11 }, boxWidth: 10, padding: 10 } },
        tooltip: {
          callbacks: {
            label: function(ctx) {
              const val = ctx.parsed;
              const pct = total > 0 ? (val / total * 100).toFixed(1) : 0;
              const formatted = tooltipFmt ? tooltipFmt(val) : ('\u20B9' + Math.round(val).toLocaleString('en-IN'));
              return ' ' + formatted + '  (' + pct + '%)';
            }
          }
        }
      }
    }
  });
}

function periodNav(off, incFn, decFn, resetFn) {
  const isCurrent = off === 0;
  return '<div class="period-nav">' +
    '<button class="btn btn-ghost btn-sm" onclick="' + decFn + '">‹</button>' +
    '<div class="period-label">' + monthLabel(off) + '</div>' +
    '<button class="btn btn-ghost btn-sm" onclick="' + incFn + '" ' + (isCurrent ? 'style="opacity:0.3"' : '') + '>›</button>' +
    (!isCurrent ? '<button class="btn btn-ghost btn-sm" onclick="' + resetFn + '">Today</button>' : '') +
    '</div>';
}

function renderB2B() {
  const off = b2bOff;
  const monthOrders = ordersInRange(off);

  let totalMRP = 0, totalSVC = 0;
  monthOrders.forEach(o => { const r = getRevenue(o); totalMRP += r.mrp; totalSVC += r.svc; });
  const totalRev = totalMRP + totalSVC;

  // 6-month trend
  const trend = [-5,-4,-3,-2,-1,0].map(m => {
    let mrp = 0, svc = 0;
    ordersInRange(m).forEach(o => { const r = getRevenue(o); mrp += r.mrp; svc += r.svc; });
    const d = new Date(); d.setDate(1); d.setMonth(d.getMonth() + m);
    return { label: d.toLocaleString('en-IN', { month: 'short' }), mrp: mrp, svc: svc };
  });

  // Beer map
  const beerMap = {};
  BEERS.forEach(b => { beerMap[b.code] = { kegs: 0, litres: 0, mrp: 0, svc: 0 }; });
  monthOrders.forEach(o => {
    const r = getRevenue(o);
    const totalL = (o.items || []).reduce((s, i) => s + i.qty * i.size, 0);
    (o.items || []).forEach(i => {
      const bc = baseCode(i.beer);
      if (!beerMap[bc]) beerMap[bc] = { kegs: 0, litres: 0, mrp: 0, svc: 0 };
      beerMap[bc].kegs += i.qty;
      beerMap[bc].litres += i.qty * i.size;
      if (totalL > 0) {
        const frac = (i.qty * i.size) / totalL;
        beerMap[bc].mrp += r.mrp * frac;
        beerMap[bc].svc += r.svc * frac;
      }
    });
  });

  // Bar map
  const barMap = {};
  monthOrders.forEach(o => {
    const b = findBar(o.barId) || { barName: 'Unknown' };
    if (!barMap[b.barName]) barMap[b.barName] = { mrp: 0, svc: 0, kegs: 0 };
    const r = getRevenue(o);
    barMap[b.barName].mrp += r.mrp;
    barMap[b.barName].svc += r.svc;
    barMap[b.barName].kegs += (o.items || []).reduce((s, i) => s + i.qty, 0);
  });

  const beerRows = BEERS.filter(b => {
    const d = beerMap[b.code];
    return d && (d.kegs > 0);
  }).map(b => {
    const d = beerMap[b.code] || { kegs: 0, litres: 0, mrp: 0, svc: 0 };
    const tot = d.mrp + d.svc;
    return '<tr>' +
      '<td><span class="badge" style="background:' + b.color + '22;color:' + b.color + '">' + b.code + '</span> <span style="color:var(--muted)">' + b.name + (b.inactive ? ' <span style="font-size:10px;color:var(--muted)">(retired)</span>' : '') + '</span></td>' +
      '<td>' + d.kegs + '</td>' +
      '<td>' + d.litres + 'L</td>' +
      '<td>' + fmtINR(d.mrp) + '</td>' +
      '<td>' + fmtINR(d.svc) + '</td>' +
      '<td style="font-weight:700;color:var(--orange)">' + fmtINR(tot) + '</td>' +

    const name = entry[0];

      '<td style="font-weight:600">' + name + '</td>' +
      '<td>' + d.kegs + '</td>' +
      '<td>' + fmtINR(d.mrp) + '</td>' +
      '<td>' + fmtINR(d.svc) + '</td>' +

      '<div class="stat-card"><div class="stat-num" style="color:var(--orange)">' + fmtINR(totalRev) + '</div><div class="stat-lbl">Total Revenue</div></div>' +
      '<div class="stat-card"><div class="stat-num" style="color:var(--blue)">' + fmtINR(totalMRP) + '</div><div class="stat-lbl">MRP Revenue</div></div>' +
      '<div class="stat-card"><div class="stat-num" style="color:var(--purple)">' + fmtINR(totalSVC) + '</div><div class="stat-lbl">Service Revenue</div></div>' +

    '<div class="card">' +
      '<div class="card-title">All Bars — ' + monthLabel(off) + '</div>' +
      '<div class="tbl-wrap"><table>' +
        '<thead><tr><th>Bar</th><th>Kegs</th><th>MRP</th><th>Service</th><th>Total</th></tr></thead>' +
        '<tbody>' + (barRows || '<tr><td colspan="5" class="empty">No orders this month</td></tr>') + '</tbody>' +
      '</table></div>' +
    '</div>';

  makeBarChart('b2b-trend',
    trend.map(t => t.label),
    [
      { label: 'Revenue', data: trend.map(t => t.mrp + t.svc), backgroundColor: '#C8721A88', borderColor: '#C8721A', borderWidth: 2, borderRadius: 4 }
    ]
  );

  const activeBeers = BEERS.filter(b => beerMap[b.code] && beerMap[b.code].kegs > 0);
  const donutData = beerMixMode === 'volume'
    ? activeBeers.map(b => beerMap[b.code].litres)
    : activeBeers.map(b => beerMap[b.code].mrp + beerMap[b.code].svc);
  const donutFmt = beerMixMode === 'volume' ? (v => Math.round(v) + 'L') : null;
  makeDoughnut('b2b-beer-donut', activeBeers.map(b => b.name), donutData, activeBeers.map(b => b.color), donutFmt);
}

// ── Growler tab ───────────────────────────────────────────────────────────────
function renderGrowlers() {
  const off = growOff;
  const { start, end } = monthRange(off);
  const monthSales = growlerSales.filter(s => { const d = new Date(s.date); return d >= start && d < end; });

  let totalMRP = 0, totalSVC = 0;
  monthSales.forEach(s => { totalMRP += Number(s.mrpAmount) || 0; totalSVC += Number(s.svcAmount) || 0; });

  const rows = monthSales.slice().sort((a,b) => b.date.localeCompare(a.date)).map(s => {
    const bi = BEERS.find(b => b.code === s.beer) || {};
    return '<tr>' +
      '<td>' + fmtDate(s.date) + '</td>' +
      '<td><span class="badge" style="background:' + (bi.color||'#888') + '22;color:' + (bi.color||'#888') + '">' + s.beer + '</span></td>' +
      '<td>' + s.volume + 'L</td>' +
      '<td>' + fmtINR(s.mrpAmount||0) + '</td>' +
      '<td>' + fmtINR(s.svcAmount||0) + '</td>' +
      '<td style="font-weight:700;color:var(--orange)">' + fmtINR((s.mrpAmount||0)+(s.svcAmount||0)) + '</td>' +
      '<td><button class="btn btn-danger btn-sm" onclick="deleteGrowler(\'' + s.id + '\')">✕</button></td>' +
    '</tr>';
  }).join('');

  const trend = [-5,-4,-3,-2,-1,0].map(m => {
    const { start: s, end: e } = monthRange(m);
    let mrp = 0, svc = 0;
    growlerSales.filter(gs => { const d = new Date(gs.date); return d >= s && d < e; })
      .forEach(gs => { mrp += Number(gs.mrpAmount)||0; svc += Number(gs.svcAmount)||0; });
    const dt = new Date(); dt.setDate(1); dt.setMonth(dt.getMonth() + m);
    return { label: dt.toLocaleString('en-IN', { month: 'short' }), mrp: mrp, svc: svc };
  });

  document.getElementById('content').innerHTML =
    '<div class="period-nav">' +
      '<button class="btn btn-ghost btn-sm" onclick="growOff--;renderGrowlers()">‹</button>' +
      '<div class="period-label">' + monthLabel(off) + '</div>' +
      '<button class="btn btn-ghost btn-sm" onclick="growOff++;renderGrowlers()" ' + (off===0?'style="opacity:0.3"':'') + '>›</button>' +
      (off!==0?'<button class="btn btn-ghost btn-sm" onclick="growOff=0;renderGrowlers()">Today</button>':'') +
      '<button class="btn btn-primary btn-sm" style="margin-left:auto" onclick="showAddGrowler()">+ Add Entry</button>' +
    '</div>' +

    '<div class="stat-row" style="grid-template-columns:1fr 1fr 1fr">' +
      '<div class="stat-card"><div class="stat-num" style="color:var(--orange)">' + fmtINR(totalMRP+totalSVC) + '</div><div class="stat-lbl">Total Revenue</div></div>' +
      '<div class="stat-card"><div class="stat-num" style="color:var(--blue)">' + fmtINR(totalMRP) + '</div><div class="stat-lbl">MRP Revenue</div></div>' +
      '<div class="stat-card"><div class="stat-num" style="color:var(--purple)">' + fmtINR(totalSVC) + '</div><div class="stat-lbl">Service Revenue</div></div>' +
    '</div>' +

    '<div class="grid2">' +
      '<div class="card">' +
        '<div class="card-title">Monthly Trend</div>' +
        '<div class="chart-wrap"><canvas id="growl-trend"></canvas></div>' +
      '</div>' +
      '<div class="card">' +
        '<div class="card-title">Entries — ' + monthLabel(off) + '</div>' +
        '<div class="tbl-wrap"><table>' +
          '<thead><tr><th>Date</th><th>Beer</th><th>Volume</th><th>MRP</th><th>Service</th><th>Total</th><th></th></tr></thead>' +
          '<tbody>' + (rows || '<tr><td colspan="7" class="empty">No entries this month. Use + Add Entry to record a sale.</td></tr>') + '</tbody>' +
        '</table></div>' +
      '</div>' +
    '</div>';

  makeBarChart('growl-trend',
    trend.map(t => t.label),
    [
      { label: 'Revenue', data: trend.map(t => t.mrp + t.svc), backgroundColor: '#C8721A88', borderColor: '#C8721A', borderWidth: 2, borderRadius: 4 }
    ]
  );
}

function showAddGrowler() {
  const today = new Date().toISOString().slice(0, 10);
  const beerOpts = BEERS.map(b => '<option value="' + b.code + '">' + b.code + ' — ' + b.name + '</option>').join('');
  document.getElementById('modal-root').innerHTML =
    '<div class="modal-overlay" onclick="if(event.target===this)closeModal()">' +
      '<div class="modal-box">' +
        '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:18px">' +
          '<div style="font-size:15px;font-weight:700">Add Growler Entry</div>' +
          '<button onclick="closeModal()" style="background:none;border:none;font-size:22px;cursor:pointer;color:var(--muted);line-height:1">×</button>' +
        '</div>' +
        '<div style="display:grid;gap:12px">' +
          '<div><label class="lbl">Date</label><input id="g-date" type="date" class="inp" style="width:100%" value="' + today + '"></div>' +
          '<div><label class="lbl">Beer</label><select id="g-beer" class="inp" style="width:100%">' + beerOpts + '</select></div>' +
          '<div><label class="lbl">Volume (L)</label><input id="g-vol" type="number" class="inp" style="width:100%" placeholder="e.g. 120"></div>' +
          '<div style="display:grid;grid-template-columns:1fr 1fr;gap:12px">' +
            '<div><label class="lbl">MRP Amount (₹)</label><input id="g-mrp" type="number" class="inp" style="width:100%" placeholder="0"></div>' +
            '<div><label class="lbl">Service Amount (₹)</label><input id="g-svc" type="number" class="inp" style="width:100%" placeholder="0"></div>' +
          '</div>' +
        '</div>' +
        '<div style="display:flex;gap:10px;margin-top:18px;justify-content:flex-end">' +
          '<button class="btn btn-ghost" onclick="closeModal()">Cancel</button>' +
          '<button class="btn btn-primary" onclick="saveGrowlerEntry()">Save Entry</button>' +
        '</div>' +
      '</div>' +
    '</div>';
}

async function saveGrowlerEntry() {
  const date = document.getElementById('g-date').value;
  const beer = document.getElementById('g-beer').value;
  const volume = Number(document.getElementById('g-vol').value) || 0;
  const mrpAmount = Number(document.getElementById('g-mrp').value) || 0;
  const svcAmount = Number(document.getElementById('g-svc').value) || 0;
  if (!date || !beer) { alert('Please fill in date and beer.'); return; }
  growlerSales.push({ id: uid(), date: date, beer: beer, volume: volume, mrpAmount: mrpAmount, svcAmount: svcAmount });
  await saveGrowlers();
  closeModal();
  renderGrowlers();
}

async function deleteGrowler(id) {
  if (!confirm('Delete this entry?')) return;
  growlerSales = growlerSales.filter(s => s.id !== id);
  await saveGrowlers();
  renderGrowlers();
}

// ── Consolidated tab ──────────────────────────────────────────────────────────
function renderConsolidated() {
  if (consView === 'monthly') { renderConsMontly(); return; }
  if (consView === 'fy')      { renderConsFY(); return; }
  renderConsOverview();
}

function consViewNav() {
  return '<div class="period-nav" style="margin-bottom:16px">' +
    '<button class="btn btn-sm ' + (consView==='overview'?'btn-primary':'btn-ghost') + '" onclick="consView=\'overview\';renderConsolidated()">Overview</button>' +
    '<button class="btn btn-sm ' + (consView==='monthly'?'btn-primary':'btn-ghost') + '" onclick="consView=\'monthly\';renderConsolidated()">Month-wise</button>' +
    '<button class="btn btn-sm ' + (consView==='fy'?'btn-primary':'btn-ghost') + '" onclick="consView=\'fy\';renderConsolidated()">FY-wise</button>' +
  '</div>';
}

function renderConsOverview() {
  const fy = currentFY();
  const fyOrders = ordersInFY(fy);
  const fyGrow = growlersInFY(fy);

  let totalRev = 0, totalLitres = 0;
  fyOrders.forEach(o => { const r = getRevenue(o); totalRev += r.mrp + r.svc; totalLitres += (o.items||[]).reduce((s,i) => s+i.qty*i.size,0); });
  fyGrow.forEach(s => { totalRev += (Number(s.mrpAmount)||0) + (Number(s.svcAmount)||0); totalLitres += Number(s.volume)||0; });

  // Beer mix
  const beerMap = {};
  BEERS.forEach(b => { beerMap[b.code] = { litres: 0, rev: 0 }; });
  fyOrders.forEach(o => {
    const r = getRevenue(o);
    const totalL = (o.items||[]).reduce((s,i) => s+i.qty*i.size, 0);
    (o.items||[]).forEach(i => {
      const bc = baseCode(i.beer);
      if (!beerMap[bc]) beerMap[bc] = { litres: 0, rev: 0 };
      beerMap[bc].litres += i.qty * i.size;
      if (totalL > 0) beerMap[bc].rev += (r.mrp + r.svc) * (i.qty * i.size) / totalL;
    });
  });

  // Top 10 bars
  const barMap = {};
  fyOrders.forEach(o => {
    const b = findBar(o.barId) || { barName: 'Unknown' };
    if (!barMap[b.barName]) barMap[b.barName] = { rev: 0, litres: 0 };
    const r = getRevenue(o);
    barMap[b.barName].rev += r.mrp + r.svc;
    barMap[b.barName].litres += (o.items||[]).reduce((s,i) => s+i.qty*i.size, 0);
  });
  const top10 = Object.entries(barMap).sort((a,b) => b[1].rev - a[1].rev).slice(0, 10);
  const barRows = top10.map(function(entry) {
    return '<tr><td style="font-weight:600">' + entry[0] + '</td>' +
      '<td>' + entry[1].litres + 'L</td>' +
      '<td style="font-weight:700;color:var(--orange)">' + fmtINR(entry[1].rev) + '</td></tr>';
  }).join('');

  const activeBeers = BEERS.filter(b => beerMap[b.code] && beerMap[b.code].litres > 0);

  document.getElementById('content').innerHTML =
    consViewNav() +
    '<div style="font-size:11px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:0.8px;margin-bottom:12px">' + fy + ' — Year to Date</div>' +

    '<div class="stat-row" style="grid-template-columns:1fr 1fr">' +
      '<div class="stat-card"><div class="stat-num" style="color:var(--orange)">' + fmtINR(totalRev) + '</div><div class="stat-lbl">Total Revenue</div></div>' +
      '<div class="stat-card"><div class="stat-num" style="color:var(--blue)">' + Math.round(totalLitres) + 'L</div><div class="stat-lbl">Total Litres Sold</div></div>' +
    '</div>' +

    '<div class="grid2">' +
      '<div class="card">' +
        '<div class="card-title">Beer Mix — Revenue</div>' +
        '<div class="chart-wrap" style="height:220px"><canvas id="cons-beer-donut"></canvas></div>' +
      '</div>' +
      '<div class="card">' +
        '<div class="card-title">Top 10 Bars — ' + fy + '</div>' +
        '<div class="tbl-wrap"><table>' +
          '<thead><tr><th>Bar</th><th>Litres</th><th>Revenue</th></tr></thead>' +
          '<tbody>' + (barRows || '<tr><td colspan="3" class="empty">No data</td></tr>') + '</tbody>' +
        '</table></div>' +
      '</div>' +
    '</div>';

  makeDoughnut('cons-beer-donut',
    activeBeers.map(b => b.name),
    activeBeers.map(b => beerMap[b.code].rev),
    activeBeers.map(b => b.color)
  );
}

function renderConsMontly() {
  const off = consOff;
  const { start, end } = monthRange(off);
  const monthOrders = ordersInRange(off);
  const monthGrow = growlerSales.filter(s => { const d = new Date(s.date); return d >= start && d < end; });

  let b2bMRP = 0, b2bSVC = 0;
  monthOrders.forEach(o => { const r = getRevenue(o); b2bMRP += r.mrp; b2bSVC += r.svc; });
  let grMRP = 0, grSVC = 0;
  monthGrow.forEach(s => { grMRP += Number(s.mrpAmount)||0; grSVC += Number(s.svcAmount)||0; });
  const total = b2bMRP + b2bSVC + grMRP + grSVC;

  document.getElementById('content').innerHTML =
    consViewNav() +
    periodNav(off, 'consOff++;renderConsolidated()', 'consOff--;renderConsolidated()', 'consOff=0;renderConsolidated()') +

    '<div class="stat-row">' +
      '<div class="stat-card"><div class="stat-num" style="color:var(--orange)">' + fmtINR(total) + '</div><div class="stat-lbl">Total Revenue</div></div>' +
      '<div class="stat-card"><div class="stat-num" style="color:var(--blue)">' + fmtINR(b2bMRP+b2bSVC) + '</div><div class="stat-lbl">B2B Revenue</div></div>' +
      '<div class="stat-card"><div class="stat-num" style="color:var(--purple)">' + fmtINR(grMRP+grSVC) + '</div><div class="stat-lbl">Growler Revenue</div></div>' +
      '<div class="stat-card"><div class="stat-num" style="color:var(--green)">' + monthOrders.length + '</div><div class="stat-lbl">B2B Orders</div></div>' +
    '</div>' +

    '<div class="card">' +
      '<div style="display:grid;gap:10px">' +
        '<div class="rev-tile">' +
          '<div class="rev-tile-title">B2B (' + monthOrders.length + ' orders)</div>' +
          '<div class="rev-tile-row"><span>MRP</span><b>' + fmtINR(b2bMRP) + '</b><span>Service</span><b>' + fmtINR(b2bSVC) + '</b></div>' +
          '<div class="rev-tile-total">' + fmtINR(b2bMRP+b2bSVC) + '</div>' +
        '</div>' +
        '<div class="rev-tile">' +
          '<div class="rev-tile-title">Growlers (' + monthGrow.length + ' entries)</div>' +
          '<div class="rev-tile-row"><span>MRP</span><b>' + fmtINR(grMRP) + '</b><span>Service</span><b>' + fmtINR(grSVC) + '</b></div>' +
          '<div class="rev-tile-total">' + fmtINR(grMRP+grSVC) + '</div>' +
        '</div>' +
        '<div style="padding:14px 16px;background:var(--orange-light);border:1px solid var(--orange);border-radius:var(--radius-sm);display:flex;justify-content:space-between;align-items:center">' +
          '<span style="font-weight:700;font-size:13px">Grand Total</span>' +
          '<span style="font-size:22px;font-weight:800;color:var(--orange)">' + fmtINR(total) + '</span>' +
        '</div>' +
      '</div>' +
    '</div>';
}

function renderConsFY() {
  const fy = consFY;
  const months = fyMonths(fy);

  const data = months.map(m => {
    const ms = m.date;
    const me = new Date(ms.getFullYear(), ms.getMonth() + 1, 1);
    let b2b = 0, grow = 0;
    allOrders().filter(o => { const d = new Date(o.deliveryDate); return d >= ms && d < me; })
      .forEach(o => { const r = getRevenue(o); b2b += r.mrp + r.svc; });
    growlerSales.filter(s => { const d = new Date(s.date); return d >= ms && d < me; })
      .forEach(s => { grow += (Number(s.mrpAmount)||0) + (Number(s.svcAmount)||0); });
    return { label: m.label, b2b, grow };
  });

  let fyRev = 0, fyOrders = ordersInFY(fy);
  fyOrders.forEach(o => { const r = getRevenue(o); fyRev += r.mrp + r.svc; });
  growlersInFY(fy).forEach(s => { fyRev += (Number(s.mrpAmount)||0) + (Number(s.svcAmount)||0); });

  document.getElementById('content').innerHTML =
    consViewNav() +
    '<div style="display:flex;align-items:center;gap:8px;margin-bottom:16px">' +
      '<button class="btn btn-sm ' + (fy==='FY26-27'?'btn-primary':'btn-ghost') + '" onclick="consFY=\'FY26-27\';renderConsolidated()">FY 26-27</button>' +
      '<button class="btn btn-sm ' + (fy==='FY25-26'?'btn-primary':'btn-ghost') + '" onclick="consFY=\'FY25-26\';renderConsolidated()">FY 25-26</button>' +
      '<span style="margin-left:auto;font-weight:700;font-size:13px;color:var(--orange)">' + fmtINR(fyRev) + ' total</span>' +
    '</div>' +

    '<div class="card">' +
      '<div class="card-title">Monthly Revenue — ' + fy + '</div>' +
      '<div class="chart-wrap" style="height:280px"><canvas id="cons-fy-chart"></canvas></div>' +
    '</div>';

  makeStackedBarChart('cons-fy-chart', data.map(d => d.label), [
    { label: 'B2B',      data: data.map(d => d.b2b),  backgroundColor: '#C8721A', borderColor: '#C8721A', borderWidth: 0, borderRadius: 0 },
    { label: 'Growlers', data: data.map(d => d.grow), backgroundColor: '#7C3AED', borderColor: '#7C3AED', borderWidth: 0, borderRadius: 0 }
  ]);
}

function closeModal() { document.getElementById('modal-root').innerHTML = ''; }

function render() {
  if (currentTab === 'b2b') renderB2B();
  else if (currentTab === 'growlers') renderGrowlers();
  else renderConsolidated();
}

document.getElementById('login-pw').focus();
